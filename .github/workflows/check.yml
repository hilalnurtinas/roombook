name: check
on:
  push:
  pull_request:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Workspace health
        run: ./scripts/doctor

  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: roombook
          POSTGRES_PASSWORD: roombook
          POSTGRES_DB: roombook
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://roombook:roombook@localhost:5432/roombook
      TEST_DATABASE_URL: postgresql+asyncpg://roombook:roombook@localhost:5432/roombook_test
    steps:
      - uses: actions/checkout@v4
      # The bootstrap workflow may add toolchain setup steps here (e.g. setup-dotnet, setup-node)
      # to match the commands it writes into scripts/check.conf.
      - uses: actions/setup-python@v5
        if: hashFiles('pyproject.toml') != ''
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: hashFiles('pyproject.toml') != ''
        run: pip install -e ".[dev]"
      - name: Create test database
        if: hashFiles('pyproject.toml') != ''
        run: PGPASSWORD=roombook psql -h localhost -U roombook -d roombook -c "CREATE DATABASE roombook_test;"
      - name: Verification contract
        run: |
          if [ -f scripts/check.conf ]; then
            ./scripts/check
          else
            echo "scripts/check.conf not present yet (pre-bootstrap) — skipping."
          fi
